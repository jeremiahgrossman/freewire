# A resolver that answers NXDOMAIN for everything, for Config 4.
#
# The DNS transport must fail cleanly so the fallback chain reaches icmp_udp.
# Point the client at this with "dns_resolver": "127.0.0.1:5353" rather than
# redirecting port 53 with pf, which would take the operator's own DNS with it.
port=5353
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
address=/#/
