name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy:
    name: Privacy constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Constraint 1: client IPs must never reach a log line. The data must not
      # exist, so the check is on the symbol appearing at all in server code.
      #
      # Scope is server/ only, mirroring the authoritative Go test
      # TestServerSourceNeverUsesRemoteAddr (server/internal/transport/
      # privacy_lint_test.go), which is the source of truth for this constraint.
      # The privacy guarantee is that the SERVER never records a client's source
      # IP. On the client (tunnel/) RemoteAddr() reads the address the client
      # dials OUT to -- our own server or carrier edge -- which it pins outside
      # the tunnel (carrier peer pinning) and probes; that is not a user IP and
      # not sensitive. _test.go is excluded for the same reason the Go test skips
      # it: tests name the symbol on purpose (this file, and fakes that implement
      # net.Conn.RemoteAddr()).
      - name: No RemoteAddr in server code
        run: |
          # Strip // comments before matching so the rule can be discussed in
          # prose without tripping itself.
          if grep -rn --include='*.go' --exclude='*_test.go' 'RemoteAddr' server/ \
             | grep -v -E ':[0-9]+:\s*//'; then
            echo "::error::RemoteAddr is banned in server code — client IPs must never enter a code path that could log them."
            exit 1
          fi
          echo "ok: no RemoteAddr references in server source"

      # Constraint 2: the WireGuard private key never leaves the device. Catch
      # the obvious regression of logging or persisting it server-side.
      - name: No private key logging
        run: |
          if grep -rn --include='*.go' -E 'zap\.(String|Any)\("(private_key|privateKey)"' server/ tunnel/; then
            echo "::error::Private key must never be written to a log."
            exit 1
          fi
          echo "ok: no private key logging"

  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

      - name: Static binary builds for linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/freewire-server

  tunnel:
    name: Tunnel (Go)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tunnel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tunnel/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  macos:
    name: macOS app (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build \
            -project macos/Freewire/Freewire.xcodeproj \
            -scheme Freewire \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild build \
            -project macos/Freewire/Freewire.xcodeproj \
            -scheme Freewire \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
